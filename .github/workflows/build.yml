name: Build

# Packages the app: on main (a safety net after each merge), on release tags, and by hand from the Actions
# tab. Pull requests only run tests.yml; tests/test_packaging.py covers what usually breaks a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also build macOS and Linux (they aren't supported for now, so they are off by default)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows only for now. Run the workflow by hand with "all_platforms" ticked to build macOS
      # and Linux too. To bring them back on main and releases, drop the `inputs` test
      # so the long list is always used; the steps below still handle every OS.
      # (The oldest supported Ubuntu is used so the AppImage runs on older glibc too.)
      matrix:
        include: >-
          ${{ fromJSON(inputs.all_platforms && '[{"name": "Windows x64", "os": "windows-latest"}, {"name": "macOS Apple Silicon", "os": "macos-15"}, {"name": "macOS Intel", "os": "macos-15-intel"}, {"name": "Linux x86_64", "os": "ubuntu-22.04"}]' || '[{"name": "Windows x64", "os": "windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/subsentiment/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        # Nothing is packaged, or released, unless the whole suite passes on that OS.
        run: python tools/check.py --no-fetch

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build
        shell: bash
        run: python packaging/build.py

      - name: Check the app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\ikari\ikari.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          if (-not (Test-Path dist\ikari-Setup-*.exe)) { throw "Installer missing" }

      - name: Check the app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil verify dist/ikari-*.dmg
          "dist/ikari.app/Contents/MacOS/ikari" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { wait "$pid"; echo "App exited early with code $?"; exit 1; }
          kill "$pid"

      - name: Check the app starts (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          xvfb-run -a dist/ikari-*.AppImage &
          pid=$!
          sleep 15
          kill -0 "$pid" || { wait "$pid"; echo "App exited early with code $?"; exit 1; }
          pkill -f "ikari/ikari" || true

      - uses: actions/upload-artifact@v5
        with:
          name: ikari-${{ matrix.os }}
          path: dist/ikari-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --title "ikari ${GITHUB_REF_NAME#v}" --generate-notes
