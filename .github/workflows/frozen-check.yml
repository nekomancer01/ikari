# Throwaway (not for main): build the app with PyInstaller around a harness that sets a word's meaning and
# checks the worker processes scored it.
name: Frozen rescore check
on:
  push:
    branches: [claude/project-thread-ojtwem-wincheck]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the harness
        shell: bash
        run: |
          sed 's#os.path.join(HERE, "launch.py")#os.path.join(HERE, "check", "launch_check.py")#' packaging/subsentiment.spec > packaging/check.spec
          grep -n launch_check packaging/check.spec
          python -m PyInstaller packaging/check.spec --noconfirm --distpath dist --workpath build
      - name: Set a word in a big subreddit in the packaged app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/check/make_db.py big.db
          ls dist/ikari
          if [ "$RUNNER_OS" = Windows ]; then exe=dist/ikari/ikari.exe; else exe=dist/ikari/ikari; fi
          timeout 600 "$exe" big.db Big awful
