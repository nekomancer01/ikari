name: UI matrix

# Renders the main window on common screens and scalings with each OS's own font engine and uploads the
# screenshots and report (tools/ui_matrix.py), for looking at by hand. Run it from the Actions tab. The layout
# checks themselves already run in the required "Windows tests" check (tests/test_layout.py).
on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also render on macOS (not supported for now, so off by default)"
        type: boolean
        default: false

concurrency:
  group: ui-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: UI matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.all_platforms && '[{"name": "Windows", "os": "windows-latest", "screens": "win-"}, {"name": "macOS", "os": "macos-15", "screens": "mac-"}]' || '[{"name": "Windows", "os": "windows-latest", "screens": "win-"}]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Render
        shell: bash
        run: |
          python tools/ui_matrix.py --out ui-matrix/dark --only ${{ matrix.screens }}
          python tools/ui_matrix.py --out ui-matrix/light --theme light --no-sweep --only ${{ matrix.screens }}
          if [ "$RUNNER_OS" = Windows ]; then
            # The text before the switch to grayscale edges, at the owner's 1920x1200 150%.
            python tools/ui_matrix.py --out ui-matrix/cleartype --subpixel --no-sweep --only win-1920x1200-150
          fi
          cat ui-matrix/dark/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-matrix-${{ matrix.name }}
          path: ui-matrix
