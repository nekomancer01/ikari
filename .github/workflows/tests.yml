name: Tests

# Scratch branch only: times test_stop_doesnt_wait_for_a_comment_tree_still_downloading on Windows.
on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe (${{ matrix.load }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        load: [alone, under-suite]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe
        run: |
          if ("${{ matrix.load }}" -eq "under-suite") {
            Start-Process python -ArgumentList "-m","pytest","-q","-n","2","--ignore=tests/test_layout.py" -NoNewWindow
            Start-Sleep -Seconds 20
          }
          python tools/probe_stop.py 25
      - name: The test itself, 30 times in fresh workers
        run: |
          python -m pytest -q -p no:cacheprovider "tests/test_collect.py::test_stop_doesnt_wait_for_a_comment_tree_still_downloading" --count 1 2>&1 | Select-Object -Last 3
          for ($i = 0; $i -lt 30; $i++) { python -m pytest -q --durations=1 "tests/test_collect.py::test_stop_doesnt_wait_for_a_comment_tree_still_downloading" 2>&1 | Select-String -Pattern "passed|failed|call " }
