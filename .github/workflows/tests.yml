name: Tests

# The whole test suite, e2e, layout and packaging checks included, through the same command contributors run
# before pushing, spread over many machines so it finishes sooner. The few tests that don't depend on the OS
# (SHARED in tests/conftest.py) run once, on Linux. Everything else runs on each OS, split into the layout matrix
# (CPU-heavy renders) and the rest (the timing-sensitive fetch tests among it), so neither slows the other
# down, and each of those into shards that take every Nth test.
# "Windows tests" is the required check for pull requests ("Protect main" ruleset) and passes only when every
# Windows shard and the shared tests pass; the Linux shards run alongside but aren't required.
# (On main the Build workflow runs the whole suite in one go before packaging.)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared:
    name: Shared tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch --part shared

  windows:
    name: Windows tests (${{ matrix.part }} ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: layout, shard: 1/2}
          - {part: layout, shard: 2/2}
          - {part: other, shard: 1/3}
          - {part: other, shard: 2/3}
          - {part: other, shard: 3/3}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch --part ${{ matrix.part }} --shard ${{ matrix.shard }}

  # Passes only when every Windows shard and the shared tests did, so the required check keeps its name.
  test:
    name: Windows tests
    needs: [shared, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Windows shard and the shared tests passed
        run: '[ "${{ needs.shared.result }}" = success ] && [ "${{ needs.windows.result }}" = success ]'

  linux:
    name: Linux tests (${{ matrix.part }} ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: layout, shard: 1/2}
          - {part: layout, shard: 2/2}
          - {part: other, shard: 1/2}
          - {part: other, shard: 2/2}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch --part ${{ matrix.part }} --shard ${{ matrix.shard }}
