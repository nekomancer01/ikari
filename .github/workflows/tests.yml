name: Tests

# The whole test suite, e2e, layout and packaging checks included, through the same command contributors run
# before pushing, split over two machines per OS: the layout matrix (CPU-heavy renders) on one, everything else
# (the timing-sensitive fetch tests among it) on the other, so neither slows the other down. "Windows tests" is
# the required check for pull requests ("Protect main" ruleset) and passes only when both Windows parts pass;
# the Linux parts run alongside but aren't required.
# (On main the Build workflow runs the whole suite in one go before packaging.)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows tests (${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: layout, args: tests/test_layout.py}
          - {part: other, args: --ignore=tests/test_layout.py}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch ${{ matrix.args }}

  # Passes only when both Windows parts did, so the required check keeps its name.
  test:
    name: Windows tests
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both Windows parts passed
        run: '[ "${{ needs.windows.result }}" = success ]'

  linux:
    name: Linux tests (${{ matrix.part }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: layout, args: tests/test_layout.py}
          - {part: other, args: --ignore=tests/test_layout.py}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch ${{ matrix.args }}
