name: Tests

# The whole test suite, e2e, layout and packaging checks included, through the same command contributors run
# before pushing, spread over many machines so it finishes sooner. Each job is named after what its tests cover
# (the areas in tests/conftest.py). The few tests that don't depend on the OS run once, on Linux, as "Shared".
# Everything else runs on each OS, with the layout matrix (CPU-heavy renders) apart from the timing-sensitive
# app tests, so neither slows the other down.
# "Windows tests" is the required check for pull requests ("Protect main" ruleset) and passes only when every
# Windows job and the shared one pass; the Linux jobs run alongside but aren't required.
# (On main the Build workflow runs the whole suite in one go before packaging.)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared:
    name: Shared · Archive client, Reddit helpers & sentiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch --area shared

  windows:
    name: Windows · ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Layout on small screens", args: --area layout-small}
          - {name: "Layout on large screens", args: --area layout-large}
          - {name: "Coverage page", args: --area coverage}
          # The longest area, split in two: every other test each.
          - {name: "App end to end (1 of 2)", args: --area app --shard 1/2}
          - {name: "App end to end (2 of 2)", args: --area app --shard 2/2}
          - {name: "Units: window, storage, fetching & platform", args: --area units}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch ${{ matrix.args }}

  # Passes only when every Windows job and the shared one did, so the required check keeps its name.
  test:
    name: Windows tests
    needs: [shared, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Windows job and the shared one passed
        run: '[ "${{ needs.shared.result }}" = success ] && [ "${{ needs.windows.result }}" = success ]'

  linux:
    name: Linux · ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Layout on small screens", args: --area layout-small}
          - {name: "Layout on large screens", args: --area layout-large}
          - {name: "Coverage page & app end to end", args: "--area coverage,app"}
          - {name: "Units: window, storage, fetching & platform", args: --area units}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python tools/check.py --no-fetch ${{ matrix.args }}
