[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsentiment"
version = "0.1.0"
description = "Desktop app to gather subreddit posts/comments and analyse their sentiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "keyring>=24",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
subsentiment = "subsentiment.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"subsentiment.gui" = ["assets/*"]
