[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsentiment"
dynamic = ["version"]
description = "Desktop app to gather subreddit posts/comments and analyse their sentiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.7",
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'",  # a newer SQLite, for search
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "pyinstaller", "ruff>=0.15", "hypothesis>=6.100"]
train = ["scikit-learn>=1.4", "scipy", "numpy"]

[project.gui-scripts]
subsentiment = "subsentiment.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "subsentiment.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning raised by the app's own code fails the test that raised it. Ignored: PySide calling
# ExpandedClientAreaHint by the deprecated name it shares a value with (native/macos.py uses the new name), and
# connections closed by the garbage collector rather than by close() (the windows' Saved rows aren't closed yet).
filterwarnings = [
    "error:::subsentiment",
    "ignore:Enum value 'Qt..WindowType.MaximizeUsingFullscreenGeometryHint':DeprecationWarning",
    "ignore::ResourceWarning",
]

# Lint for bugs, not style (tests/test_lint.py runs it): pyflakes (undefined and unused names, broken f-strings),
# syntax newer than the oldest Python supported, bugbear and pylint's errors. Bugbear's loop-variable and zip
# checks are off: the code's lambdas run before their loop moves on (yield from on_thread), and its zips pair
# equal lengths on purpose.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "B", "PLE"]
ignore = ["B007", "B008", "B023", "B904", "B905"]

[tool.setuptools.package-data]
"subsentiment.gui" = ["assets/*"]
"subsentiment.data" = ["*.json.gz"]
