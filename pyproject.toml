[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsentiment"
dynamic = ["version"]
description = "Desktop app to gather subreddit posts/comments and analyse their sentiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "keyring>=24",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["scikit-learn>=1.4", "scipy", "numpy"]

[project.gui-scripts]
subsentiment = "subsentiment.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "subsentiment.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"subsentiment.gui" = ["assets/*"]
"subsentiment.data" = ["*.json.gz"]
